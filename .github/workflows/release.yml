# Releases do Ipê: Windows (instalador + portátil) e Linux (portátil).
#
# Só roda quando alguém aperta "Run workflow" (ou `gh workflow run release.yml`): combinado com o
# Filipe em 02/11/2026 — release só quando ele pedir, nunca a cada atualização.
# A segmentação (TotalSegmentator, ~5 GB) não vai junto: continua no instalar_segmentacao.
name: Release

on:
  workflow_dispatch:
    inputs:
      rascunho:
        description: "Criar como rascunho (só aparece para o dono até publicar)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ia]" "pyinstaller>=6.0"
      - name: Versão
        id: v
        shell: bash
        run: echo "versao=$(python -c 'import ipe;print(ipe.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Empacotar
        run: |
          python installer/make_icon.py
          python -m PyInstaller --noconfirm --clean --workpath build-pyi --distpath dist installer/ipe.spec
      - name: Conferir o pacote (abre, idiomas, 180 exames de teste)
        run: python installer/verifica.py
      - name: Portátil
        shell: pwsh
        run: Compress-Archive -Path 'dist\Ipe\*' -DestinationPath "dist\Ipe-${{ steps.v.outputs.versao }}-windows-portatil.zip" -Force
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersao=${{ steps.v.outputs.versao }}" installer\ipe.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Ipe-*-instalador.exe
            dist/Ipe-*-windows-portatil.zip

  linux:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do sistema (Qt)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - name: Bibliotecas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ia]" "pyinstaller>=6.0"
      - name: Versão
        id: v
        run: echo "versao=$(python -c 'import ipe;print(ipe.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Empacotar
        run: python -m PyInstaller --noconfirm --clean --workpath build-pyi --distpath dist installer/ipe.spec
      - name: Conferir o pacote
        run: python installer/verifica.py
      - name: Portátil
        run: tar czf "dist/Ipe-${{ steps.v.outputs.versao }}-linux-portatil.tar.gz" -C dist Ipe
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/Ipe-*-linux-portatil.tar.gz

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
      - name: Notas (a entrada do CHANGELOG desta versão)
        id: n
        run: |
          V=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/ipe/__init__.py').read()).group(1))")
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          python3 - "$V" > notas.md <<'PY'
          import sys
          v = sys.argv[1]
          linhas, dentro = [], False
          for l in open("CHANGELOG.md", encoding="utf-8"):
              if l.startswith("## "):
                  if dentro:
                      break
                  dentro = l[3:].strip().startswith(v)
              if dentro:
                  linhas.append(l)
          print("".join(linhas) or f"Versão {v}.")
          print("\n---\n**Windows:** o instalador põe o programa no perfil do usuário, sem administrador. "
                "O executável ainda não é assinado: o Windows pode mostrar o aviso do SmartScreen "
                "(\"Mais informações\" ▸ \"Executar assim mesmo\").\n\n**Linux:** descompacte e rode `Ipe/Ipe`.\n\n"
                "A segmentação (TotalSegmentator) se instala à parte, pelo `instalar_segmentacao`.")
          PY
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.n.outputs.versao }}
          RASC=""
          if [ "${{ inputs.rascunho }}" = "true" ]; then RASC="--draft"; fi
          gh release create "v$V" pacotes/*/* --title "Ipê $V" --notes-file notas.md --target "$GITHUB_SHA" $RASC
