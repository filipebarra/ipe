# Releases do Ipê: Windows (installer + portable) e Linux (portable com install.sh + .deb, desde a 0.100.6).
# Nomes em inglês desde a 0.99.81.
#
# Só roda quando alguém aperta "Run workflow" (ou `gh workflow run release.yml`): combinado com o
# Filipe em 02/11/2026 — release só quando ele pedir, nunca a cada atualização.
# A segmentação (TotalSegmentator, ~5 GB) não vai junto: continua no instalar_segmentacao.
name: Release

on:
  workflow_dispatch:
    inputs:
      rascunho:
        description: "Criar como rascunho (só aparece para o dono até publicar)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bibliotecas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ia]" "pyinstaller>=6.0"
      - name: Versão
        id: v
        shell: bash
        run: echo "versao=$(python -c 'import ipe;print(ipe.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Empacotar
        run: |
          python installer/make_icon.py
          python -m PyInstaller --noconfirm --clean --workpath build-pyi --distpath dist installer/ipe.spec
      - name: Conferir o pacote (abre, idiomas, 180 exames de teste)
        run: python installer/verifica.py
      - name: Portátil
        shell: pwsh
        run: Compress-Archive -Path 'dist\Ipe\*' -DestinationPath "dist\Ipe-${{ steps.v.outputs.versao }}-windows-portable.zip" -Force
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersao=${{ steps.v.outputs.versao }}" installer\ipe.iss
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            dist/Ipe-*-installer.exe
            dist/Ipe-*-windows-portable.zip

  linux:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bibliotecas do sistema (Qt)
        # 0.100.11: o espelho do Ubuntu da Azure às vezes some do DNS do runner: com falha, troca para outros
        # espelhos e tenta de novo
        run: |
          PKGS="libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1"
          for i in 1 2 3 4; do
            if sudo apt-get -o Acquire::Retries=3 update 2>&1 | tee /tmp/apt.log && ! grep -q "Failed to fetch" /tmp/apt.log; then
              sudo apt-get install -y $PKGS && exit 0
            fi
            echo "apt falhou (tentativa $i): trocando de espelho"
            printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://mirrors.edge.kernel.org/ubuntu/\tpriority:2\nhttp://mirror.math.princeton.edu/pub/ubuntu/\tpriority:3\n' | sudo tee /etc/apt/apt-mirrors.txt
            sudo sed -i 's#https\?://security.ubuntu.com/ubuntu#http://mirrors.edge.kernel.org/ubuntu#g' /etc/apt/sources.list || true
            sleep 20
          done
          sudo apt-get install -y $PKGS
      - name: Bibliotecas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ia]" "pyinstaller>=6.0"
      - name: Versão
        id: v
        run: echo "versao=$(python -c 'import ipe;print(ipe.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Empacotar
        run: python -m PyInstaller --noconfirm --clean --workpath build-pyi --distpath dist installer/ipe.spec
      - name: Conferir o pacote
        run: python installer/verifica.py
      - name: Portátil (com o install.sh e o ícone)
        run: |
          install -m 755 installer/linux/install.sh dist/Ipe/install.sh
          install -m 644 installer/linux/ipe.png dist/Ipe/ipe.png
          tar czf "dist/Ipe-${{ steps.v.outputs.versao }}-linux-portable.tar.gz" -C dist Ipe
      - name: Pacote .deb
        run: bash installer/linux/build_deb.sh dist/Ipe "${{ steps.v.outputs.versao }}" dist
      - name: Conferir o .deb e o install.sh (instala de verdade no runner)
        run: |
          sudo apt-get install -y "./dist/Ipe-${{ steps.v.outputs.versao }}-linux-amd64.deb"
          test -x /opt/ipe/Ipe && test -L /usr/bin/ipe-viewer && test -f /usr/share/applications/ipe-viewer.desktop
          ipe-viewer --help | head -3
          sudo apt-get remove -y ipe-viewer && test ! -e /opt/ipe/Ipe
          H=$(mktemp -d); mkdir x && tar xzf "dist/Ipe-${{ steps.v.outputs.versao }}-linux-portable.tar.gz" -C x
          HOME=$H bash x/Ipe/install.sh && HOME=$H "$H/.local/bin/ipe-viewer" --help | head -3
          HOME=$H bash x/Ipe/install.sh --uninstall && test ! -e "$H/.local/share/ipe/programa"
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: |
            dist/Ipe-*-linux-portable.tar.gz
            dist/Ipe-*-linux-amd64.deb

  release:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: pacotes
      - name: Notas (a entrada do CHANGELOG.en.md desta versão; desde a 0.99.33 o release sai em inglês)
        id: n
        run: |
          V=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/ipe/__init__.py').read()).group(1))")
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          python3 - "$V" > notas.md <<'PY'
          import sys
          v = sys.argv[1]
          linhas, dentro = [], False
          for l in open("CHANGELOG.en.md", encoding="utf-8"):
              if l.startswith("## "):
                  if dentro:
                      break
                  dentro = l[3:].strip().startswith(v)
              if dentro:
                  linhas.append(l)
          print("".join(linhas) or f"Version {v}.")
          print("\n---\n**Windows:** the installer puts the program in the user profile, without administrator "
                "rights, and asks for the language (English by default; Portuguese and Spanish also available). "
                "The executable is not signed yet: Windows may show the SmartScreen warning "
                "(\"More info\" ▸ \"Run anyway\").\n\n**Linux:** on Debian/Ubuntu, install the `.deb` "
                "(`sudo apt install ./Ipe-*-linux-amd64.deb`; the command is `ipe-viewer`). Or extract the portable "
                "and run `Ipe/install.sh` (installs for your user, no administrator; `--system` for all users, "
                "`--uninstall` to remove), or just run `Ipe/Ipe`. On first launch it asks for the language, with "
                "English selected.\n\n"
                "Organ segmentation (TotalSegmentator) is installed separately, with `instalar_segmentacao`.\n\n"
                "*Notas em português: [CHANGELOG.md](https://github.com/filipebarra/ipe/blob/main/CHANGELOG.md) · "
                "Notas en español: [CHANGELOG.es.md](https://github.com/filipebarra/ipe/blob/main/CHANGELOG.es.md)*")
          PY
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.n.outputs.versao }}
          RASC=""
          if [ "${{ inputs.rascunho }}" = "true" ]; then RASC="--draft"; fi
          gh release create "v$V" pacotes/*/* --title "Ipê $V" --notes-file notas.md --target "$GITHUB_SHA" $RASC
