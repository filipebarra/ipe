# Pacote de TESTE do Ipê para macOS (0.100.24). Não publica nada: os .dmg ficam como artefato da execução (2 dias)
# e num release em RASCUNHO (só o dono vê), de onde são baixados para o computador do Filipe testar num Mac.
name: macOS (teste)

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Anexar os .dmg ao release desta versão (v<versão>), em vez do rascunho"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arq: arm64
          - runner: macos-15-intel
            arq: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bibliotecas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ia]" "pyinstaller>=6.0"
      - name: Versão
        id: v
        run: echo "versao=$(python -c 'import ipe;print(ipe.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Ícone (.icns a partir do PNG)
        run: |
          mkdir ipe.iconset
          for t in 16 32 128 256 512; do
            sips -z $t $t installer/linux/ipe.png --out ipe.iconset/icon_${t}x${t}.png >/dev/null
            d=$((t*2)); sips -z $d $d installer/linux/ipe.png --out ipe.iconset/icon_${t}x${t}@2x.png >/dev/null
          done
          iconutil -c icns ipe.iconset -o installer/ipe.icns
      - name: Empacotar
        run: python -m PyInstaller --noconfirm --clean --workpath build-pyi --distpath dist installer/ipe.spec
      - name: Conferir o pacote (pasta)
        run: python installer/verifica.py
      - name: Conferir o Ipe.app (abre, versão, idiomas)
        run: |
          test -x dist/Ipe.app/Contents/MacOS/Ipe
          dist/Ipe.app/Contents/MacOS/ipe-cli info | head -20
          file dist/Ipe.app/Contents/MacOS/Ipe
          codesign -dv dist/Ipe.app 2>&1 | head -5 || true
          # abre a janela de verdade por alguns segundos, sem tela (offscreen), e vê se continua de pé
          HOME=$(mktemp -d) dist/Ipe.app/Contents/MacOS/Ipe & P=$!
          sleep 25
          if kill -0 $P 2>/dev/null; then echo "JANELA_DE_PE"; kill $P; else echo "O programa fechou sozinho"; exit 1; fi
      - name: Pacote (.dmg com o atalho de Aplicativos e o LEIAME)
        run: |
          V=${{ steps.v.outputs.versao }}
          mkdir dmg && cp -R dist/Ipe.app dmg/ && ln -s /Applications dmg/Applications
          cp installer/macos/LEIAME-macOS.txt dmg/ 2>/dev/null || true
          # o hdiutil dos runners às vezes responde "Resource busy": tenta de novo
          for i in 1 2 3 4 5; do
            hdiutil create -volname "Ipe $V" -srcfolder dmg -ov -format UDZO "Ipe-$V-macos-${{ matrix.arq }}-TESTE.dmg" && break
            sleep 15
          done
          ls -la *.dmg
      - uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arq }}
          path: Ipe-*-macos-*.dmg
          retention-days: 2

  rascunho:
    needs: macos
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: pacotes
      - name: Guardar (rascunho) ou anexar ao release da versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la pacotes/*/
          V=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/ipe/__init__.py').read()).group(1))")
          if [ "${{ inputs.publicar }}" = "true" ]; then
            mkdir pub
            for f in pacotes/*/*.dmg; do cp "$f" "pub/$(basename "$f" | sed 's/-TESTE//')"; done
            ls -la pub
            gh release upload "v$V" pub/*.dmg --repo "$GITHUB_REPOSITORY" --clobber
          else
            N="macos-teste-${{ github.run_number }}"
            gh release create "$N" pacotes/*/*.dmg --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "macOS (teste, não publicado) $N" \
              --notes "Pacote de teste do Ipê para macOS. Rascunho: não publicar. arm64 = chip Apple; x86_64 = Intel."
          fi
