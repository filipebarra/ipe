# Diagnóstico no macOS (0.100.27): roda o Ipê num Mac do GitHub, COM tela (cocoa), do código-fonte e empacotado,
# tira fotos da tela e junta os logs. Só exames sintéticos. Não publica nada: o resultado sai num rascunho.
name: macOS (diagnóstico)

on:
  workflow_dispatch:
    inputs:
      empacotado:
        description: "Também gerar o Ipe.app e repetir o roteiro nele"
        type: boolean
        default: true
      maquina:
        description: "Runner (macos-15, macos-26…)"
        type: string
        default: macos-15
      fuzz:
        description: "Mutações por par (imagem, decodificador); 0 = roteiro da janela em vez do fuzz"
        type: string
        default: "0"

permissions:
  contents: write

jobs:
  diag:
    runs-on: ${{ inputs.maquina }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bibliotecas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ia]" "pyinstaller>=6.0"
          python -m pip install python-gdcm     # só para o diagnóstico (gera os arquivos e é comparado); o programa não usa
      - name: Decodificadores com arquivos estragados (processo morto = defeito)
        if: ${{ inputs.fuzz != '0' }}
        run: |
          mkdir -p diag
          python -m pip list 2>/dev/null | grep -i "gdcm\|jpeg\|pydicom\|pillow\|numpy" | tee diag/versoes.txt
          sw_vers | tee -a diag/versoes.txt
          python tools/diag_fuzz.py "${{ inputs.fuzz }}" "$PWD/diag/fuzz" 2>&1 | tee diag/fuzz.log
          rm -rf diag/fuzz/imagens
      - name: Preparar (idioma, modo, exames de teste, comprimidos)
        if: ${{ inputs.fuzz == '0' }}
        run: |
          mkdir -p diag
          python -m ipe set-language pt-BR || true
          python -m ipe set-mode single || true
          python -m ipe sample "$PWD/amostras" | tail -1
          python tools/diag_comprimir.py "$PWD/amostras" "$PWD/amostras/comprimidos" 12
          find amostras -type f | wc -l
      - name: Roteiro na janela, do código-fonte
        if: ${{ inputs.fuzz == '0' }}
        run: |
          bash tools/diag_roteiro.sh fonte python -m ipe
      - name: Empacotar
        if: ${{ inputs.empacotado && inputs.fuzz == '0' }}
        run: |
          mkdir ipe.iconset
          for t in 16 32 128 256 512; do
            sips -z $t $t installer/linux/ipe.png --out ipe.iconset/icon_${t}x${t}.png >/dev/null
            d=$((t*2)); sips -z $d $d installer/linux/ipe.png --out ipe.iconset/icon_${t}x${t}@2x.png >/dev/null
          done
          iconutil -c icns ipe.iconset -o installer/ipe.icns
          python -m PyInstaller --noconfirm --clean --workpath build-pyi --distpath dist installer/ipe.spec > diag/pyinstaller.log 2>&1 || (tail -40 diag/pyinstaller.log; exit 1)
      - name: Roteiro na janela, empacotado (aberto como o usuário abre)
        if: ${{ inputs.empacotado && inputs.fuzz == '0' }}
        run: |
          rm -rf "$HOME/Library/Application Support/DicomViewer/dicomviewer.sqlite" "$HOME/Library/Application Support/DicomViewer/Storage"
          bash tools/diag_roteiro.sh app ABRIR_APP
      - name: Links do sistema (ipe:// e o apelido osirix://) com o programa empacotado
        if: ${{ inputs.empacotado && inputs.fuzz == '0' }}
        run: |
          CLI=dist/Ipe.app/Contents/MacOS/ipe-cli
          LS=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          $LS -f "$PWD/dist/Ipe.app"
          python - <<'PY'
          from ipe.core.config import Settings, get_paths
          s = Settings(get_paths().settings_file)
          c = dict(s.get("dicom", {}) or {})
          c["link_apelidos"] = ["osirix"]
          c["link_sem_token"] = "aceitar"
          s.set("dicom", c)
          s.save()
          print("configurado:", get_paths().settings_file)
          PY
          $CLI register-url | tee diag/links.txt
          ls -la "$HOME/Applications/Ipe links" | tee -a diag/links.txt
          # 1) com o programa fechado: o link abre o programa
          open "ipe://open?accession=LINKFECHADO"
          sleep 45
          screencapture -x diag/link_1.png || true
          # 2) com o programa aberto: o apelido, no formato do OsiriX
          open "osirix://?methodName=displayStudy&AccessionNumber=LINKAPELIDO"
          sleep 20
          screencapture -x diag/link_2.png || true
          pkill -f "Ipe.app/Contents/MacOS/Ipe" || true
          sleep 3
          grep -h "Link do sistema\|Chamada externa\|Link inv" "$HOME"/Library/Logs/DicomViewer/*.log | tail -20 | tee -a diag/links.txt
          grep -q "LINKFECHADO" diag/links.txt && echo "LINK_IPE_OK" | tee -a diag/links.txt || echo "LINK_IPE_FALHOU" | tee -a diag/links.txt
          grep -q "LINKAPELIDO" diag/links.txt && echo "LINK_APELIDO_OK" | tee -a diag/links.txt || echo "LINK_APELIDO_FALHOU" | tee -a diag/links.txt
      - name: Guardar (rascunho, não publicado)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$HOME/Library/Logs/DicomViewer/"*.log diag/ 2>/dev/null || true
          cd diag && zip -q -r ../diag-macos.zip . && cd ..
          gh release create "macos-diag-${{ github.run_number }}" diag-macos.zip --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "macOS diagnóstico ${{ github.run_number }} (não publicado)" --notes "Fotos da tela e logs do teste automático no macOS. Só exames sintéticos."
